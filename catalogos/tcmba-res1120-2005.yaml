# Resolução TCM-BA nº 1.120/2005 — Sistemas de Controle Interno nos Poderes Executivo e Legislativo municipais.
# `descricao` reproduz o texto oficial (aprovada em 21/12/2005).
#
# aplicavel_a: "todos" | "executivo" (todos exceto Câmara) | "legislativo" (só Câmara) | lista de TipoCliente.
# Itens próprios da gestão do Executivo (receita, dívida ativa, precatórios, operações de crédito etc.)
# estão marcados como "executivo"; o controlador pode ajustar a aplicabilidade em cada ciclo.

norma:
  codigo: TCMBA-RES-1120
  versao: "2005"
  titulo: Resolução TCM-BA nº 1.120/2005 — Sistemas de Controle Interno Municipais
  orgao_emissor: Tribunal de Contas dos Municípios do Estado da Bahia
  data_publicacao: 2005-12-21
  fonte_url: https://www.tcm.ba.gov.br
  descricao: >-
    Dispõe sobre a criação, a implementação e a manutenção de Sistemas de Controle Interno nos Poderes
    Executivo e Legislativo municipais, e dá outras providências.

aplicavel_a: todos

requisitos:
  # ─────────── Capítulo I, Seção I — Obrigatoriedade ───────────
  - codigo: "Art. 1º"
    titulo: Implantação e manutenção integrada do Sistema de Controle Interno
    descricao: >-
      Os Poderes Executivo e Legislativo municipais implantarão e manterão, de forma integrada, Sistemas de
      Controle Interno Municipais, de conformidade com o mandamento contido no art. 74, I a IV, da Constituição da
      República Federativa do Brasil, e no art. 90, I a IV e respectivo parágrafo único, da Constituição do Estado
      da Bahia.

  # ─────────── Seção II — Conceito e garantias ───────────
  - codigo: "Art. 2º"
    titulo: Conceito de Sistema de Controle Interno Municipal
    avaliavel: false
    descricao: >-
      Entende-se por Sistema de Controle Interno Municipal o conjunto de normas, regras, princípios, planos,
      métodos e procedimentos que, coordenados entre si, têm por objetivo efetivar a avaliação da gestão pública e
      o acompanhamento dos programas e políticas públicas bem como, evidenciando sua legalidade e razoabilidade,
      avaliar os seus resultados no que concerne à economia, eficiência e eficácia da gestão orçamentária,
      financeira, patrimonial e operacional dos órgãos e entidades municipais.

  - codigo: "Art. 3º"
    titulo: Garantias conferidas aos gestores pela manutenção do sistema
    avaliavel: false
    descricao: >-
      A manutenção de Sistemas de Controle Interno Municipais confere aos Gestores a garantia de que se vejam
      cumpridas: I - a promoção de operações metódicas, regulares e repetidas que visem aferir, no processo de
      produção de bens e/ou serviços pelo município, a estrita observância aos princípios constitucionais da
      legalidade, publicidade, razoabilidade, economicidade e eficiência; II - a preservação dos recursos públicos
      municipais, buscando defendê-los e eximi-los de prejuízos advindos de desvios, desperdícios, abusos, erros,
      fraudes ou irregularidades; III - a promoção e o respeito a leis e regulamentações, bem como a normas e
      diretrizes emanadas do próprio órgão ou entidade, desde que não conflitem com a legislação em vigor; e IV - a
      elaboração e a manutenção de dados financeiros e de gestão confiáveis, apresentando-os correta e
      ordenadamente, quando solicitados pelo Tribunal de Contas dos Municípios.

  - codigo: "Art. 4º"
    titulo: Atividades exercidas por servidores do quadro permanente, sem delegação
    descricao: >-
      As atividades inerentes ao controle interno serão exercidas em todos os níveis hierárquicos dos Poderes
      Executivo e Legislativo municipais, bem como das entidades da administração indireta do município, por
      servidores municipais, ocupantes de cargos públicos do quadro permanente do órgão ou entidade, não sendo
      passíveis de delegação por se tratar de atividades próprias do Município.

  # ─────────── Seção III — Suporte institucional ───────────
  - codigo: "Art. 5º"
    titulo: Órgão Central criado por lei e diretamente subordinado ao chefe do Poder
    descricao: >-
      As atividades dos Sistemas de Controle Interno Municipais serão atribuídas a unidades específicas – os Órgãos
      Centrais do Sistema - que, criadas por lei municipal, possuam estruturas condizentes com o porte e a
      complexidade do respectivo Poder, ficando diretamente subordinada ao Prefeito ou Presidente de Câmara,
      conforme o caso, vedada a subordinação hierárquica a outro qualquer órgão/unidade da estrutura dos Poderes ou
      da entidade.
    filhos:
      - codigo: "Art. 5º, parágrafo único"
        titulo: Órgãos setoriais do Executivo reportando-se ao Órgão Central
        aplicavel_a: executivo
        descricao: >-
          O Sistema de Controle Interno do Poder Executivo terá como órgãos setoriais a Contabilidade, as
          Supervisões e Diretorias das Secretarias Municipais e os órgãos das entidades da administração indireta,
          os quais se reportarão ao Órgão Central no que concerne à prestação de informações referentes a suas
          atividades.

  - codigo: "Art. 6º"
    titulo: Unidade de controle interno sem outras atribuições
    descricao: >-
      O Sistema de Controle Interno Municipal não poderá ser alocado a unidade a criar ou já existente na estrutura
      do órgão municipal que seja, ou venha a ser, responsável por outro qualquer tipo de atividade que não a de
      controle interno.

  - codigo: "Art. 7º"
    titulo: Vedação de terceirização
    descricao: >-
      É vedada, sob qualquer pretexto ou hipótese, a terceirização da implantação e manutenção do Sistema de
      Controle Interno Municipal, cujo exercício é de exclusiva competência do órgão que o instituiu.

  - codigo: "Art. 8º"
    titulo: Acesso irrestrito às informações
    descricao: >-
      À unidade responsável pela manutenção do Sistema de Controle Interno Municipal não será negado o acesso a
      informações pertinentes ao objeto de sua ação por quaisquer unidades da estrutura do órgão ou entidade
      municipal, seja qual for o nível hierárquico ao qual pertencerem.

  # ─────────── Seção IV — Finalidade ───────────
  - codigo: "Art. 9º"
    titulo: Finalidades do Sistema de Controle Interno
    avaliavel: false
    descricao: >-
      Constituem finalidades do Sistema de Controle Interno Municipal: I - avaliar o cumprimento das metas
      previstas no plano plurianual, a execução dos programas de governo e do orçamento do município; II -
      comprovar a legalidade e avaliar os resultados, quanto à economia, eficiência e eficácia, da gestão
      orçamentária, financeira e patrimonial nos órgãos e entidades municipais, bem como da aplicação de recursos
      públicos por entidades de direito privado, resultante de repasse de recursos efetivado pelo órgão ou entidade
      municipal; III - exercer o controle das operações de crédito e garantias, bem como dos direitos e deveres do
      município; IV - apoiar o controle externo no exercício de sua missão institucional.

  # ─────────── Seção V — Competência ───────────
  - codigo: "Art. 10"
    titulo: Competências do Sistema de Controle Interno
    avaliavel: false
    descricao: >-
      Compete ao Sistema de Controle Interno Municipal, além de outras atividades que forem fixadas por lei
      municipal no ato de criação da unidade administrativa pertinente:
    filhos:
      - codigo: "Art. 10, I"
        titulo: Normatizar, sistematizar e padronizar procedimentos operacionais
        descricao: >-
          normatizar, sistematizar e padronizar os procedimentos operacionais dos órgãos municipais, observadas as
          disposições da Lei Complementar nº 6, de 06.12.91, a Lei Orgânica do Tribunal de Contas dos Municípios, e
          demais normas editadas pela Corte;
      - codigo: "Art. 10, II"
        titulo: Verificar a consistência do Relatório de Gestão Fiscal e assiná-lo
        descricao: >-
          verificar a consistência dos dados contidos no Relatório de Gestão Fiscal, conforme estabelecido pelo
          art. 54 da Lei Complementar nº 101, de 04.05.00, o qual será assinado, também, pelo chefe da unidade
          responsável pela manutenção do Sistema de Controle Interno Municipal;
      - codigo: "Art. 10, III"
        titulo: Controlar operações de crédito, garantias, direitos e haveres
        aplicavel_a: executivo
        descricao: exercer o controle das operações de crédito, garantias, direitos e haveres do município;
      - codigo: "Art. 10, IV"
        titulo: Verificar recondução da dívida aos limites da LRF
        aplicavel_a: executivo
        descricao: >-
          verificar a adoção de providências para recondução dos montantes das dívidas consolidada e mobiliária aos
          limites de que trata a Lei Complementar nº 101/00;
      - codigo: "Art. 10, V"
        titulo: Verificar retorno da despesa com pessoal ao limite
        descricao: >-
          verificar e avaliar a adoção de medidas para o retorno da despesa total com pessoal ao limite de que
          tratam os arts. 22 e 23 da Lei Complementar nº 101/00;
      - codigo: "Art. 10, VI"
        titulo: Verificar limites de operações de crédito e de Restos a Pagar
        descricao: >-
          verificar a observância dos limites e das condições para realização de operações de crédito e inscrição
          em Restos a Pagar;
      - codigo: "Art. 10, VII"
        titulo: Verificar destinação de recursos de alienação de ativos
        aplicavel_a: executivo
        descricao: >-
          verificar a destinação de recursos obtidos com a alienação de ativos, tendo em vista as restrições
          constitucionais e as da Lei Complementar nº 101/00;
      - codigo: "Art. 10, VIII"
        titulo: Avaliar metas do PPA, LDO e Anexo de Metas Fiscais
        descricao: >-
          avaliar o cumprimento das metas estabelecidas no Plano Plurianual, na Lei de Diretrizes Orçamentárias e
          no Anexo de Metas Fiscais;
      - codigo: "Art. 10, IX"
        titulo: Avaliar eficácia e eficiência da gestão orçamentária, financeira e patrimonial
        descricao: >-
          avaliar os resultados, quanto à eficácia e eficiência, da gestão orçamentária, financeira e patrimonial
          dos órgãos e entidades municipais;
      - codigo: "Art. 10, X"
        titulo: Fiscalizar e avaliar a execução dos programas de governo
        descricao: fiscalizar e avaliar a execução dos programas de governo;
      - codigo: "Art. 10, XI"
        titulo: Realizar auditorias sobre a gestão de recursos, subvenções e renúncia de receitas
        descricao: >-
          realizar auditorias sobre a gestão dos recursos públicos municipais sob a responsabilidade de órgãos e
          entidades públicos e privados, bem como sobre a aplicação de subvenções e renúncia de receitas;
      - codigo: "Art. 10, XII"
        titulo: Apurar atos ilegais ou irregulares e dar ciência ao controle externo
        descricao: >-
          apurar os atos ou fatos inquinados de ilegais ou irregulares, praticados por agentes públicos ou
          privados, na utilização de recursos públicos municipais, dar ciência ao controle externo e, quando for o
          caso, comunicar à unidade responsável pela contabilidade, para as providências cabíveis;
      - codigo: "Art. 10, XIII"
        titulo: Verificar legalidade de licitações e contratos
        descricao: >-
          verificar a legalidade e a adequação aos princípios e regras estabelecidos pela Lei Federal nº 8.666/93
          dos procedimentos licitatórios e respectivos contratos efetivados e celebrados pelos órgãos e entidades
          municipais.
        orientacao: "A Lei nº 8.666/93 foi substituída pela Lei nº 14.133/2021; avaliar à luz da legislação vigente."

  # ─────────── Seção VI — Operações objeto de controles específicos ───────────
  - codigo: "Art. 11"
    titulo: Operações objeto de acompanhamento e controle específicos
    avaliavel: false
    descricao: >-
      Serão objeto de acompanhamentos e controles específicos por parte do órgão responsável pelo Sistema de
      Controle Interno Municipal: I - a execução orçamentária e financeira; II - o sistema de pessoal (ativo e
      inativo); III - os bens patrimoniais; IV – os bens em almoxarifado; V – os veículos e combustíveis; VI - as
      licitações, contratos, convênios, acordos e ajustes; VII - as obras públicas, inclusive reformas; VIII - as
      operações de créditos; IX – os limites de endividamento; X - os adiantamentos; XI - as doações, subvenções,
      auxílios e contribuições concedidos; XII - a dívida ativa; XIII - a despesa pública; XIV - a receita; XV - a
      observância dos limites constitucionais; XVI - a gestão governamental; XVII – os precatórios.
    orientacao: "As atividades de controle de cada operação estão detalhadas no art. 12."

  # ─────────── Seção VII — Atividades ───────────
  - codigo: "Art. 12"
    titulo: Atividades de controle
    avaliavel: false
    descricao: >-
      Para o pleno exercício de sua competência, os Sistemas de Controle Interno Municipais deverão desempenhar,
      dentre outras, as seguintes atividades de controle:
    filhos:
      - codigo: "Art. 12, I"
        titulo: Execução Orçamentária e Financeira
        avaliavel: false
        filhos:
          - codigo: "Art. 12, I, a"
            titulo: Registros contábeis e livros conforme a Lei nº 4.320/64
            descricao: >-
              verificar a existência, atualização e adequação dos registros dos Livros ou Fichas de Controle
              Orçamentário, do Diário, do Razão, do Caixa, dos Boletins de Tesouraria e dos Livros da Dívida Ativa
              com as normas constantes da Lei nº 4.320/64 e legislação pertinente;
          - codigo: "Art. 12, I, b"
            titulo: Guarda dos livros nos arquivos do órgão
            descricao: >-
              verificar se a guarda dos Livros está sendo feita nos arquivos do órgão ou entidade, já que é vedada
              sua permanência em escritórios de contabilidade;
          - codigo: "Art. 12, I, c"
            titulo: Livros informatizados impressos, encadernados e assinados
            descricao: >-
              verificar se os Livros informatizados estão devidamente impressos, encadernados e assinados pela
              autoridade competente;
          - codigo: "Art. 12, I, d"
            titulo: Autorização legislativa para créditos adicionais e remanejamentos
            descricao: >-
              verificar a existência de autorização legislativa para abertura de créditos adicionais,
              transposição, transferência e remanejamento de recursos de uma categoria de programação para outra;
          - codigo: "Art. 12, I, e"
            titulo: Prazos de publicação do RREO e do RGF
            descricao: >-
              verificar o cumprimento dos prazos para publicação dos relatórios da Lei Complementar nº 101/00, a
              exemplo dos Relatórios Resumidos de Execução Orçamentária e Relatório de Gestão Fiscal.

      - codigo: "Art. 12, II"
        titulo: Sistema de Pessoal
        avaliavel: false
        filhos:
          - codigo: "Art. 12, II, a"
            titulo: Fichas funcionais e financeiras individualizadas
            descricao: >-
              verificar a existência de registros/fichas funcionais e financeiras individualizados dos servidores do
              órgão ou entidade, aí se incluindo os ocupantes de cargos de provimento permanente ou efetivos, ativos
              e inativos, de cargos de provimento temporários (cargos em comissão) e os empregados contratados sob o
              regime celetário;
          - codigo: "Art. 12, II, b"
            titulo: Registros de dados pessoais e da vida funcional
            descricao: >-
              verificar a existência de registros contendo dados pessoais dos servidores e empregados, atos e datas
              de admissões, cargos ocupados ou funções exercidas, lotações, remunerações e alterações ocorridas em
              suas vidas profissionais;
          - codigo: "Art. 12, II, c"
            titulo: Registros atualizados de pensões e aposentadorias
            descricao: >-
              verificar a existência de registros atualizados das pensões e aposentadorias concedidas, identificando
              os nomes dos beneficiados e as respectivas fundamentações legais;
          - codigo: "Art. 12, II, d"
            titulo: Controle de frequência e prontuários organizados
            descricao: >-
              verificar a existência de controles de freqüências, arquivos e prontuários atualizados e organizados;
          - codigo: "Art. 12, II, e"
            titulo: Programas de capacitação continuada
            descricao: verificar a existência de programas de capacitação continuada de servidores e empregados;
          - codigo: "Art. 12, II, f"
            titulo: Segregação entre cadastro e folha de pagamento
            descricao: verificar a existência de segregação das funções de cadastro e de folha de pagamento;
          - codigo: "Art. 12, II, g"
            titulo: Recadastramento periódico de inativos e pensionistas
            descricao: verificar a realização de recadastramento periódico de servidores inativos e pensionistas;
          - codigo: "Art. 12, II, h"
            titulo: Acompanhamento de contratos por tempo determinado
            descricao: >-
              efetivar o acompanhamento de contratos de servidores por tempo determinado, analisando sua legalidade
              e visando a observância das obrigações contratuais neles contidas;
          - codigo: "Art. 12, II, i"
            titulo: Envio trimestral de informações de pessoal à Inspetoria Regional
            descricao: >-
              verificar se estão sendo encaminhados, trimestralmente, à Inspetoria Regional do TCM à qual esteja
              jurisdicionado o órgão ou entidade, informações sobre o número total de servidores públicos e
              empregados, nomeados e contratados, bem como a despesa total com o pessoal, na forma especificada pela
              Resolução TCM nº 395/99;
          - codigo: "Art. 12, II, j"
            titulo: Legalidade e legitimidade dos gastos com folha
            descricao: >-
              efetivar análise da legalidade e legitimidade dos gastos com folhas de pagamento dos órgãos e
              entidades da administração direta e indireta municipal;
          - codigo: "Art. 12, II, k"
            titulo: Relatórios gerenciais de recursos humanos
            descricao: >-
              verificar a existência e geração constante e freqüente de relatórios gerenciais relativos aos recursos
              humanos dos órgãos e entidades da administração direta e indireta municipal;
          - codigo: "Art. 12, II, l"
            titulo: Limites de despesa com pessoal
            descricao: >-
              verificar se estão sendo cumpridos os limites relativos a despesa de pessoal estabelecidos por
              legislação federal.

      - codigo: "Art. 12, III"
        titulo: Bens Patrimoniais
        avaliavel: false
        filhos:
          - codigo: "Art. 12, III, a"
            titulo: Inventário físico anual
            descricao: >-
              verificar a realização de inventários físicos periódicos dos bens patrimoniais em períodos não
              superiores a (01) um ano;
          - codigo: "Art. 12, III, b"
            titulo: Numeração sequencial de registro patrimonial
            descricao: >-
              verificar se os bens de natureza permanente receberam números seqüenciais de registro patrimonial para
              identificação e inventário, por ocasião da aquisição ou da incorporação ao patrimônio;
          - codigo: "Art. 12, III, c"
            titulo: Identificação física (plaqueta, etiqueta ou carimbo)
            descricao: >-
              verificar se a numeração foi efetuada mediante gravação, fixação de plaqueta ou etiqueta apropriada e
              carimbo, no caso de material bibliográfico;
          - codigo: "Art. 12, III, d"
            titulo: Fichas ou livros de inventário completos
            descricao: >-
              verificar se os bens estão registrados em fichas ou livros de inventário, dos quais constem data de
              aquisição, incorporação ou baixa, descrição do bem, quantidade, valor, número do processo e
              identificação do responsável por sua guarda e conservação;
          - codigo: "Art. 12, III, e"
            titulo: Arquivo de notas fiscais de bens móveis
            descricao: verificar a existência de arquivos de notas fiscais para bens móveis;
          - codigo: "Art. 12, III, f"
            titulo: Termos de responsabilidade
            descricao: verificar a existência de termos de responsabilidades sobre um bem ou sobre um lote de bens.

      - codigo: "Art. 12, IV"
        titulo: Bens em Almoxarifado
        avaliavel: false
        filhos:
          - codigo: "Art. 12, IV, a"
            titulo: Registro de entradas, saídas, custos e destinação
            descricao: >-
              verificar a existência de arquivos de registro de materiais e bens que, processados em fichas ou
              magneticamente, contenham a data de entrada e saída do material, sua especificação, sua quantidade e
              custo e sua destinação, com base nas requisições de materiais;
          - codigo: "Art. 12, IV, b"
            titulo: Documento padrão de requisição de material
            descricao: verificar a existência e utilização de documento padrão para a requisição de material;
          - codigo: "Art. 12, IV, c"
            titulo: Normas sobre responsáveis pelas requisições
            descricao: >-
              verificar a existência de normas que definam quais os responsáveis pelas assinaturas das requisições
              de material;
          - codigo: "Art. 12, IV, d"
            titulo: Controle sistemático dos níveis de estoque
            descricao: verificar se os níveis de estoque estão sendo controlados e atualizados sistematicamente;
          - codigo: "Art. 12, IV, e"
            titulo: Estoque de encerramento registrado no sistema patrimonial
            descricao: >-
              verificar se o valor total do estoque apurado no encerramento do exercício ou da gestão financeira vem
              sendo registrado no sistema patrimonial;
          - codigo: "Art. 12, IV, f"
            titulo: Condições de acondicionamento
            descricao: >-
              verificar as condições de acondicionamento de bens e materiais, no que concerne à segurança,
              iluminação, ventilação, etc.;
          - codigo: "Art. 12, IV, g"
            titulo: Registro diário e balancetes mensais
            descricao: >-
              verificar a existência de registro diário das entradas e saídas do almoxarifado bem como da confecção
              de balancetes mensais;
          - codigo: "Art. 12, IV, h"
            titulo: Controle do recebimento de bens e serviços
            descricao: >-
              verificar a existência de controle das compras e aquisições de bens e serviços, seja através de
              boletins de medição de serviços, seja mediante a aferição da quantidade e qualidade do bem entregue.

      - codigo: "Art. 12, V"
        titulo: Veículos e Combustíveis
        avaliavel: false
        filhos:
          - codigo: "Art. 12, V, a"
            titulo: Fichas de registro de veículos
            descricao: >-
              verificar a existência de fichas de registros de veículos contendo informações sobre marca, cor, ano de
              fabricação, tipo, número da nota fiscal, modelo, número do motor e do chassi, placa e número de
              registro no Detran;
          - codigo: "Art. 12, V, b"
            titulo: Autorizações de abastecimento
            descricao: >-
              verificar a existência de autorizações para abastecimento de veículos e equipamentos devidamente
              implantadas;
          - codigo: "Art. 12, V, c"
            titulo: Mapas de quilometragem e abastecimento
            descricao: verificar a existência de mapas de controle de quilometragem e abastecimento;
          - codigo: "Art. 12, V, d"
            titulo: Controle de desempenho para revisões e manutenções
            descricao: >-
              verificar a existência de mapas de controle do desempenho dos veículos para a promoção de revisões
              e/ou manutenções;
          - codigo: "Art. 12, V, e"
            titulo: Controle de reposição de peças e pneus
            descricao: >-
              verificar a existência de controle sobre reposições de peças em veículos, incluindo-se pneus.

      - codigo: "Art. 12, VI"
        titulo: Licitações, Contratos, Convênios, Acordos e Ajustes
        avaliavel: false
        filhos:
          - codigo: "Art. 12, VI, a"
            titulo: Cadastro atualizado de fornecedores
            descricao: >-
              verificar a existência de cadastro atualizado de empresas que forneçam materiais ou equipamentos;
          - codigo: "Art. 12, VI, b"
            titulo: Registros e atas da comissão de licitação
            descricao: verificar a existência de registros e atas das ações da comissão de licitação;
          - codigo: "Art. 12, VI, c"
            titulo: Acompanhamento de vigência e pagamentos dos contratos
            descricao: >-
              verificar a existência de acompanhamento dos contratos celebrados pela administração no que tange à
              vigência, pagamento de parcelas, etc.;
          - codigo: "Art. 12, VI, d"
            titulo: Tabela municipal de registro de preços
            aplicavel_a: executivo
            descricao: >-
              verificar a existência de tabelas de registro de preços municipais elaborada pelo Poder Executivo
              municipal e se os órgãos e entidades municipais fazem uso dela, compatibilizando os preços constantes
              das licitações com aqueles registrados nas mencionadas tabelas.

      - codigo: "Art. 12, VII"
        titulo: Obras Públicas, inclusive Reformas
        avaliavel: false
        filhos:
          - codigo: "Art. 12, VII, a"
            titulo: Registro das obras conforme o SICOB
            descricao: >-
              verificar os registros das obras/serviços de engenharia executado e/ou em execução no município, de
              acordo com as regras constantes de Resolução do TCM que trata do Sistema SICOB;
          - codigo: "Art. 12, VII, b"
            titulo: Cadastro de fornecedores de obras à disposição do TCM
            descricao: >-
              verificar a manutenção de cadastros atualizados de fornecedores de materiais, equipamentos e serviços
              destinados às obras, os quais deverão permanecer sempre à disposição do TCM;
          - codigo: "Art. 12, VII, c"
            titulo: Identificação das obras e arquivo da documentação
            descricao: >-
              verificar se as obras/serviços de engenharia executadas ou em execução estão devidamente identificadas
              e a sua documentação arquivada em pastas especiais;
          - codigo: "Art. 12, VII, d"
            titulo: Projetos básico e executivo
            descricao: verificar se existem projetos básico e executivo;
          - codigo: "Art. 12, VII, e"
            titulo: Procedimento licitatório prévio
            descricao: verificar se as obras/serviços de engenharia foram precedidos de procedimento licitatório;
          - codigo: "Art. 12, VII, f"
            titulo: Orçamento detalhado em planilhas
            descricao: >-
              verificar se foram elaborados orçamentos detalhados em planilhas que expressem a composição de todos os
              itens e preços unitários;
          - codigo: "Art. 12, VII, g"
            titulo: Indicação da dotação orçamentária
            descricao: verificar se foi indicada a dotação por onde deveria ocorrer a despesa;
          - codigo: "Art. 12, VII, h"
            titulo: Fotografias da situação pré-existente (reformas)
            descricao: >-
              verificar se foram providenciadas fotografias da situação pré-existente, no caso de reformas;
          - codigo: "Art. 12, VII, i"
            titulo: Contrato com a executora e termos aditivos
            descricao: >-
              verificar se foi firmado contrato com a empresa executora, bem como se o mesmo foi complementado por
              termos aditivos;
          - codigo: "Art. 12, VII, j"
            titulo: Ordem de início dos serviços
            descricao: verificar se foi expedida ordem de início dos serviços;
          - codigo: "Art. 12, VII, k"
            titulo: Pagamentos com base em boletins de medição
            descricao: >-
              verificar se os pagamentos das obras/serviços de engenharia foram efetuados com base nos boletins de
              medições;
          - codigo: "Art. 12, VII, l"
            titulo: Documentos fiscais vinculados às obras contratadas
            descricao: >-
              verificar se as faturas, empenhos, notas fiscais e recibos se referem às obras contratadas;
          - codigo: "Art. 12, VII, m"
            titulo: Requisições e remanejamentos de materiais entre obras
            descricao: >-
              verificar se ocorreram requisições de materiais, bem como se houve remanejamentos daqueles excedentes de
              ou para outras obras;
          - codigo: "Art. 12, VII, n"
            titulo: Recebimento provisório ou definitivo
            descricao: verificar se as obras foram recebidas mediante termos provisórios ou definitivos;
          - codigo: "Art. 12, VII, o"
            titulo: Demais informações necessárias
            descricao: >-
              solicitar e analisar demais informações consideradas necessárias para a perfeita caracterização dos
              serviços a serem executados.

      - codigo: "Art. 12, VIII"
        titulo: Operações de Crédito
        avaliavel: false
        aplicavel_a: executivo
        filhos:
          - codigo: "Art. 12, VIII, a"
            titulo: Controle específico dos empréstimos tomados
            descricao: >-
              verificar a existência de arquivos com controles específicos de todos os empréstimos tomados pelo
              município, contendo as autorizações legais para contraí-los, os contratos, valores, prazos,
              desembolsos ou amortizações, bem como aditamentos que elevem o valor da dívida ou modifiquem prazos
              contratuais.

      - codigo: "Art. 12, IX"
        titulo: Limites de Endividamento
        avaliavel: false
        aplicavel_a: executivo
        filhos:
          - codigo: "Art. 12, IX, a"
            titulo: Alertas de proximidade do limite da dívida consolidada
            descricao: >-
              verificar a emissão de alertas na hipóteses de a dívida consolidada do município encontrar-se próxima
              dos limites fixados na Resolução nº 40, do Senado Federal.

      - codigo: "Art. 12, X"
        titulo: Adiantamentos
        avaliavel: false
        filhos:
          - codigo: "Art. 12, X, a"
            titulo: Normas sobre concessão e prestação de contas de adiantamentos
            descricao: >-
              verificar a existência de normas definindo as condições para realização de despesas sob regime de
              adiantamento e as regras para a sua concessão e prestação de contas;
          - codigo: "Art. 12, X, b"
            titulo: Ato definindo supridores e forma de prestação de contas
            descricao: >-
              verificar a existência de ato administrativo definindo quem poderá ser supridor e a forma de prestação
              das contas relativa ao adiantamento, conforme estabelecido em Resolução do TCM.

      - codigo: "Art. 12, XI"
        titulo: Doações, Subvenções, Auxílios e Contribuições
        avaliavel: false
        aplicavel_a: executivo
        filhos:
          - codigo: "Art. 12, XI, a"
            titulo: Entidade beneficiada reconhecida por lei municipal
            descricao: >-
              verificar se a entidade para a qual o recurso foi repassado é reconhecida, por lei municipal, como
              entidade civil sem fins lucrativos, como ensina Resolução deste TCM;
          - codigo: "Art. 12, XI, b"
            titulo: Prestação de contas no prazo
            descricao: >-
              verificar se as entidades que receberam recursos deles prestaram contas no prazo assinalado em
              Resolução deste Tribunal;
          - codigo: "Art. 12, XI, c"
            titulo: Documentação da prestação de contas
            descricao: >-
              verificar se da prestação de contas a que alude a alínea anterior consta a documentação estabelecida
              por Resolução deste TCM;
          - codigo: "Art. 12, XI, d"
            titulo: Parecer sobre a regularidade da prestação de contas
            descricao: >-
              emitir parecer sobre a regularidade ou não da prestação de contas da entidade civil beneficiada.

      - codigo: "Art. 12, XII"
        titulo: Dívida Ativa
        avaliavel: false
        aplicavel_a: executivo
        filhos:
          - codigo: "Art. 12, XII, a"
            titulo: Inscrição tempestiva em dívida ativa
            descricao: >-
              verificar se, depois de esgotado o prazo estabelecido para pagamento, da decisão administrativa
              irreformável ou da decisão judicial passada em julgado, o crédito tributário foi devidamente inscrito
              em dívida ativa;
          - codigo: "Art. 12, XII, b"
            titulo: Identificação e domicílio dos devedores
            descricao: >-
              verificar se constam da inscrição em dívida ativa o(s) nome(s) do(s) devedor(es) ou
              co-responsável(eis), bem como seu(s) domicílio(s) ou residência(s);
          - codigo: "Art. 12, XII, c"
            titulo: Elementos obrigatórios da inscrição
            descricao: >-
              verificar se constam da inscrição a quantia devida, o modo de cálculo dos juros de mora, a origem do
              crédito, a data de inscrição, o número do processo administrativo que originou o crédito, a indicação
              do livro e da folha de inscrição;
          - codigo: "Art. 12, XII, d"
            titulo: Comunicação ao contribuinte
            descricao: >-
              verificar se contribuinte foi devidamente comunicado da inscrição do débito em dívida ativa;
          - codigo: "Art. 12, XII, e"
            titulo: Emissão da certidão de dívida ativa
            descricao: >-
              verificar se, não sendo regularizado o débito pelo contribuinte no prazo estabelecido, foi emitida a
              certidão de dívida ativa;
          - codigo: "Art. 12, XII, f"
            titulo: Elementos obrigatórios da CDA
            descricao: >-
              verificar se da certidão de que trata a alínea anterior constam o nome do devedor, co-responsável, se
              houver, bem como domicílios ou endereços residenciais, valor original da dívida, juros e outros
              encargos previstos em lei, origem, natureza e fundamento legal, data e número de inscrição no registro
              da dívida ativa e número do processo administrativo ou do auto de infração;
          - codigo: "Art. 12, XII, g"
            titulo: Encaminhamento da CDA à Procuradoria
            descricao: >-
              verificar se a Certidão de Dívida Ativa foi encaminhada à Procuradoria do Município para que se dê
              início ao processo de execução fiscal.

      - codigo: "Art. 12, XIII"
        titulo: Despesa Pública
        avaliavel: false
        filhos:
          - codigo: "Art. 12, XIII, a"
            titulo: Descrições claras em empenhos, notas e cotações
            descricao: >-
              verificar a existência de descrições e especificações lançadas, de forma clara e detalhada, nas Notas
              de Empenho, Notas Fiscais, Recibos, cotações de preços, nos casos de aquisições por dispensa de
              licitação, e outros documentos similares;
          - codigo: "Art. 12, XIII, b"
            titulo: Elementos obrigatórios dos processos de pagamento
            descricao: >-
              verificar se nos processos de pagamento de despesas constam o nome do credor, o valor exato a pagar, a
              unidade gestora responsável pelo pagamento, o número da conta bancária e cheque, da nota de empenho e
              da nota fiscal respectiva;
          - codigo: "Art. 12, XIII, c"
            titulo: Formas de pagamento admitidas e quitação
            descricao: >-
              verificar se o pagamento foi efetuado pelas únicas formas previstas em Resolução do Tribunal: cheque
              nominativo, ordem bancária ou transferência eletrônica, e se as quitações das importâncias recebidas
              pelos credores foram efetuadas mediante assinaturas firmadas em recibo;
          - codigo: "Art. 12, XIII, d"
            titulo: Caracterização do interesse público
            descricao: analisar a caracterização do interesse público na aquisição do bem ou serviço;
          - codigo: "Art. 12, XIII, e"
            titulo: Regularidade cadastral dos fornecedores
            descricao: >-
              consultar as bases de dados dos órgãos fazendários quanto à regularidade cadastral dos fornecedores e
              prestadores de serviços.

      - codigo: "Art. 12, XIV"
        titulo: Receita
        avaliavel: false
        aplicavel_a: executivo
        filhos:
          - codigo: "Art. 12, XIV, a"
            titulo: Documentos de arrecadação municipal
            descricao: verificar a existência de documentos de arrecadação municipal;
          - codigo: "Art. 12, XIV, b"
            titulo: Registros bancários e de tesouraria
            descricao: >-
              verificar a existência de registros bancários e de Tesouraria, tais como boletins de Tesouraria,
              contas bancárias, etc.;
          - codigo: "Art. 12, XIV, c"
            titulo: Cadastro de contribuintes atualizado
            descricao: >-
              verificar a existência de cadastro de contribuintes atualizado (imóveis, prestadores de serviços,
              etc.).

      - codigo: "Art. 12, XV"
        titulo: Limites Constitucionais
        avaliavel: false
        filhos:
          - codigo: "Art. 12, XV, a, 1"
            titulo: Limite de endividamento
            aplicavel_a: executivo
            descricao: verificar a observância dos limites constitucionais atinentes ao endividamento do órgão/entidade;
          - codigo: "Art. 12, XV, a, 2"
            titulo: Limite de gastos com pessoal
            descricao: verificar a observância dos limites constitucionais atinentes aos gastos com pessoal;
          - codigo: "Art. 12, XV, a, 3"
            titulo: Aplicação mínima em educação
            aplicavel_a: [PREFEITURA]
            descricao: >-
              verificar a observância dos limites constitucionais atinentes às aplicações em educação (FUNDEF
              inclusive);
            orientacao: "O FUNDEF foi sucedido pelo FUNDEB (EC 108/2020)."
          - codigo: "Art. 12, XV, a, 4"
            titulo: Aplicação mínima em saúde
            aplicavel_a: [PREFEITURA]
            descricao: verificar a observância dos limites constitucionais atinentes aos gastos com a saúde.

      - codigo: "Art. 12, XVI"
        titulo: Gestão Governamental
        avaliavel: false
        filhos:
          - codigo: "Art. 12, XVI, a"
            titulo: Cumprimento das metas do PPA
            descricao: verificar o cumprimento das metas previstas no plano plurianual;
          - codigo: "Art. 12, XVI, b"
            titulo: Compatibilidade PPA, LDO e LOA
            descricao: verificar se os programas/projetos previstos no PPA constam da LOA e da LDO;
          - codigo: "Art. 12, XVI, c"
            titulo: Economicidade na execução das metas
            descricao: >-
              analisar, sob o aspecto da economicidade, o nível de execução das metas, o alcance dos objetivos e a
              adequação do seu gerenciamento;
          - codigo: "Art. 12, XVI, d"
            titulo: Avaliação da gestão do administrador
            descricao: >-
              avaliar a gestão do administrador, visando comprovar sua legalidade e legitimidade e seus resultados
              quanto à eficiência e eficácia dos programas/projetos executados ou em execução.

      - codigo: "Art. 12, XVII"
        titulo: Precatórios
        avaliavel: false
        aplicavel_a: executivo
        filhos:
          - codigo: "Art. 12, XVII, a"
            titulo: Inclusão no orçamento
            descricao: verificar a sua inclusão no orçamento;
          - codigo: "Art. 12, XVII, b"
            titulo: Contabilização
            descricao: verificar a sua contabilização;
          - codigo: "Art. 12, XVII, c"
            titulo: Ordem cronológica dos pagamentos
            descricao: verificar o acompanhamento da ordem cronológica dos pagamentos.

  # ─────────── Seção VIII — Apoio ao controle externo ───────────
  - codigo: "Art. 13"
    titulo: Apoio ao controle externo
    avaliavel: false
    descricao: >-
      No apoio ao controle externo exercido por este Tribunal, o Sistema de Controle Interno Municipal deverá
      desempenhar, dentre outras que lhe forem solicitadas pela Corte, as seguintes funções:
    filhos:
      - codigo: "Art. 13, I"
        titulo: Programação semestral de auditoria com envio de relatórios ao TCM
        descricao: >-
          organizar e executar, por iniciativa própria ou por determinação do Tribunal de Contas dos Municípios,
          programação semestral de auditoria contábil, financeira, orçamentária, operacional e patrimonial nas
          unidades administrativas sob seu controle, enviando ao TCM os respectivos relatórios, na forma a ser
          estabelecida em Resolução da Corte;
      - codigo: "Art. 13, II"
        titulo: Auditoria nas contas dos responsáveis, com relatório, certificado e parecer
        descricao: >-
          realizar auditorias nas contas dos responsáveis sob seu controle, emitindo relatório, certificado de
          auditoria e parecer;
      - codigo: "Art. 13, III"
        titulo: Alerta formal para instauração de Tomada de Contas Especial
        descricao: >-
          alertar formalmente a autoridade administrativa competente para que instaure Tomada de Contas Especial
          sempre que tiver conhecimento de qualquer das ocorrências que ensejem tal providência.

  # ─────────── Da Responsabilidade ───────────
  - codigo: "Art. 14"
    titulo: Comunicação de irregularidades ao TCM
    descricao: >-
      O dirigente da unidade competente para a manutenção do Sistema de Controle Interno Municipal, ao tomar
      conhecimento de qualquer irregularidade ou ilegalidade, dela dará ciência ao Tribunal de Contas dos
      Municípios, sob pena de responsabilidade solidária. § 1º Na comunicação ao Tribunal, o dirigente referido no
      caput deste artigo informará as providências adotadas para: I - corrigir a ilegalidade ou irregularidade
      detectada; II – determinar o ressarcimento de eventual dano causado ao erário; III - evitar ocorrências
      semelhantes.

  - codigo: "Art. 15"
    titulo: Responsabilidade solidária por omissão
    avaliavel: false
    descricao: >-
      Verificada em inspeção ou auditoria, ou na apreciação e julgamento das contas, irregularidade ou ilegalidade
      que não tenha sido comunicada tempestivamente ao Tribunal, notadamente as que possam vir a causar dano ao
      erário, e constatada a omissão do dirigente responsável pela unidade de manutenção do Sistema de Controle
      Interno Municipal, ficará o mesmo sujeito, na qualidade de responsável solidário, às sanções previstas para
      a espécie.

  # ─────────── Capítulo III — Obrigações e sanções ───────────
  - codigo: "Art. 16"
    titulo: Avaliação da observância de procedimentos, normas e regras
    descricao: >-
      O Sistema de Controle Interno Municipal avaliará a observância, pelas diversas instâncias e unidades dos
      órgãos e entidades, dos procedimentos, normas e regras estabelecidos pela legislação pertinente.

  - codigo: "Art. 17"
    titulo: Relatório circunstanciado nas prestações de contas mensais e anuais
    descricao: >-
      O dirigente da unidade responsável pela manutenção do Sistema de Controle Interno Municipal deverá, por
      ocasião dos preparativos das prestações de contas mensais e anuais, firmar e anexar aos demonstrativos
      mensais ou anuais relatórios circunstanciados, atestando que a documentação a ser encaminhada sofreu a devida
      análise por parte da mencionada unidade, destacando e registrando quaisquer irregularidades nelas ocorridas,
      tenham ou não sido elas sanadas. Parágrafo único. Fica vedada a assinatura, no relatório de que cuida este
      artigo, de servidor que não seja o dirigente nele identificado.

  - codigo: "Art. 18"
    titulo: Prestação de contas sem relatório é incompleta
    avaliavel: false
    descricao: >-
      As prestações de contas encaminhadas ao Tribunal de Contas dos Municípios destituídas do relatório de que
      trata o caput do artigo anterior serão consideradas incompletas, o que poderá ensejar sua rejeição.

  - codigo: "Art. 19"
    titulo: Criação da unidade por lei e comunicação ao TCM
    avaliavel: false
    descricao: >-
      Fica conferido o prazo de 270 dias, a contar da publicação desta Resolução, para que, através de lei
      municipal, se efetive a criação de unidades nos órgãos/entidades municipais, às quais será atribuída a
      responsabilidade pela manutenção do Sistema de Controle Interno Municipal, de conformidade com as regras
      contidas nesta Resolução.
    filhos:
      - codigo: "Art. 19, § 1º"
        titulo: Envio ao TCM da lei de criação e do ato de designação do dirigente
        descricao: >-
          Será encaminhada a este Tribunal de Contas dos Municípios, tão logo seja editada e publicada, cópia da
          lei municipal que instituiu a unidade de que trata este artigo, bem como do ato que designou o servidor
          municipal encarregado de chefiá-la.
        orientacao: "Reenviar ao TCM sempre que houver nova lei ou nova designação do dirigente."

  - codigo: "Art. 20"
    titulo: Possível rejeição de contas pelo descumprimento do art. 19
    avaliavel: false
    descricao: >-
      A inobservância do disposto no caput do artigo anterior, aí se incluindo aquelas de que tratam seus §§ 1º e
      2º, pelo órgão municipal, poderá ensejar a rejeição da respectiva conta anual, conforme prescreve o art. 1º,
      XXXVIII, da Resolução TCM nº 222/92.

  - codigo: "Art. 21"
    titulo: Pronunciamento expresso do chefe do Poder sobre o parecer do controle interno
    descricao: >-
      O Prefeito Municipal ou o Presidente da Câmara ou o dirigente da entidade descentralizada emitirá expresso e
      indelegável pronunciamento sobre o parecer contido no relatório do Sistema de Controle Interno relativo a
      contas, no qual atestará haver tomado conhecimento das conclusões nele contidas.

  - codigo: "Art. 22"
    titulo: Responsabilidade solidária da Contabilidade
    avaliavel: false
    descricao: >-
      A omissão ou a falsidade da informação na escrituração ou nas demonstrações a qualquer título sujeitará o
      titular, ou aquele que responder pela Contabilidade, à responsabilidade solidária por qualquer fato que
      venha provocar danos ou prejuízos ao erário, aí se incluindo a efetivação de representação ao Conselho
      Regional de Contabilidade, CRC.

  - codigo: "Art. 23"
    titulo: Impedimento de servidores com contas rejeitadas
    descricao: >-
      Ficam impedidos de atuar em qualquer função no âmbito do controle interno municipal aqueles servidores cujas
      prestações de contas, na qualidade de gestor ou responsável por bens ou dinheiros públicos, tenham sido
      rejeitadas pelo Tribunal de Contas dos Municípios ou pela Câmara Municipal respectiva.
