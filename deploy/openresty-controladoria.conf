# Exemplo para VPS que já tem OpenResty/Nginx (ou painel) nas portas 80/443.
# Cole dentro do bloco `server { ... }` do site (o HTTPS/certificado fica a cargo do painel).
#
# O app é publicado em APP_IP:APP_PORTA (padrão 127.0.0.1:3010, ver docker-compose.prod.yml). Isso funciona
# quando o OpenResty roda direto no host ou em container com `network_mode: host`.
# Se o OpenResty estiver em container SEM rede host, 127.0.0.1 é o próprio container: use o IP do gateway
# do Docker (confira com `ip -4 addr show docker0`, ex.: 172.17.0.1) no proxy_pass abaixo e no .env
# (APP_IP=172.17.0.1), para o app sair do loopback sem ficar exposto à internet. Evite APP_IP=0.0.0.0:
# portas publicadas pelo Docker passam por cima do ufw; se usar, bloqueie a porta no firewall do provedor.

# Anexos: a aplicação aceita até 105 MB por envio.
client_max_body_size 110m;

location / {
    proxy_pass http://127.0.0.1:3010;
    proxy_http_version 1.1;

    # Host/X-Forwarded-Host precisam ser o domínio público: as Server Actions comparam com o Origin.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Sobrescreve (não acrescenta): o IP gravado na auditoria é o primeiro da lista.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;

    # Relatórios em PDF e análises de IA podem demorar.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_request_buffering off;
}
